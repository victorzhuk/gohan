version: '3'

tasks:
  default:
    desc: List all tasks
    cmds:
      - task --list

  spec:types:
    desc: Generate the types index from docs
    cmds:
      - python3 tools/gen_types_index.py

  spec:coverage:
    desc: Run the spec coverage gate (extra flags after --)
    set: [pipefail]
    cmds:
      - go test -json -timeout 2m -short ./... | python3 tools/spec_coverage.py {{.CLI_ARGS}}

  spec:
    desc: Regenerate the types index and run the spec coverage gate
    deps: [spec:types, spec:coverage]

  api:check:
    desc: apidiff of every module against its last tag
    cmds:
      - |
        set -euo pipefail
        for dir in . adapter/*; do
          [ -f "$dir/go.mod" ] || continue
          mod=$(sed -n 's/^module //p' "$dir/go.mod")
          if [ "$dir" = . ]; then prefix=v; else prefix="$dir/v"; fi
          tag=$(git tag --list --sort=-v:refname "$prefix*" | head -1)
          if [ -z "$tag" ]; then
            echo "api:check: $mod: no tag yet, skipped (no baseline to diff against)"
            continue
          fi
          echo "api:check: $mod: diffing HEAD against $tag"
          go run ./tools/apicheck -dir "$dir" -tag "$tag"
        done

  lint:
    desc: Run golangci-lint (extra flags after --)
    cmds:
      - golangci-lint run {{.CLI_ARGS}}

  test:
    desc: Run short unit tests
    cmds:
      - go test -timeout 2m -short ./...
      - go -C adapter/otel test -timeout 2m -short ./...
      - go -C examples test -timeout 2m -short ./...

  examples:test:
    desc: Run the examples module tests
    cmds:
      - go -C examples test -timeout 2m -short ./...

  test:race:
    desc: Run short unit tests with the race detector
    cmds:
      - go test -timeout 10m -race -short ./...
      - go -C adapter/otel test -timeout 10m -race -short ./...
      - go -C examples test -timeout 10m -race -short ./...

  bench:
    desc: Run benchmarks once each
    cmds:
      - go test -timeout 10m -run '^$' -bench . -benchtime=1x ./...

  bench:gate:
    desc: Run the base/head performance regression gate (BASE/HEAD overrides)
    cmds:
      - go run ./tools/performance_gate.go --base '{{.BASE | default "HEAD~1"}}' --head '{{.HEAD | default "HEAD"}}' --baselines core/performance_baselines.json
