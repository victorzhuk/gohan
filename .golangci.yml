version: "2"

linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        # desc: core carries no dependency — only $gostd and this module's own packages, never std or adapter.
        core-no-std-or-adapter:
          files:
            - "**/core/**"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/victorzhuk/gohan"
          deny:
            - pkg: "github.com/victorzhuk/gohan/std"
              desc: core never imports std
            - pkg: "github.com/victorzhuk/gohan/adapter"
              desc: core never imports adapter
        # desc: std carries no dependency on adapters.
        std-no-adapter:
          files:
            - "**/std/**"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/victorzhuk/gohan"
          deny:
            - pkg: "github.com/victorzhuk/gohan/adapter"
              desc: std never imports adapter
        # desc: a leaf package under core must not import the driver package (core) or core/runtime.
        core-leaf-no-driver-or-runtime:
          files:
            - "**/core/types/**"
            - "**/core/stores/**"
            - "**/core/chains/**"
            - "**/core/guards/**"
            - "**/core/permission/**"
            - "**/core/suspension/**"
            - "**/core/streams/**"
            - "**/core/flowdef/**"
            - "!$test"
          deny:
            - pkg: "github.com/victorzhuk/gohan/core$"
              desc: leaf packages never import the driver package
            - pkg: "github.com/victorzhuk/gohan/core/runtime"
              desc: leaf packages never import core/runtime

formatters:
  enable:
    - gofmt
    - goimports
